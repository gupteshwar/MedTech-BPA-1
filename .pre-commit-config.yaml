exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "medtech_bpa.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                medtech_bpa/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                medtech_bpa/templates/includes/.*|
                medtech_bpa/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                medtech_bpa/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                medtech_bpa/templates/includes/.*|
                medtech_bpa/public/js/lib/.*
            )$

  - repo: local
    hooks:
      - id: check-whitelist-type-hints
        name: Check Whitelisted Functions for Type Hints
        entry: python scripts/check_whitelist_type_hints.py
        language: python
        files: \.py$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
